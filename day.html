<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細行程 - 旅遊小書</title>
  <style>
    :root {
      --primary: #c2593f;
      --bg: #f5eedc;
      --card: #fffdfa;
      --text: #2c2523;
      --sub-text: #7c6f66;
      --border-dashed: #d8c8b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#e2d5c3 1px, transparent 1px);
      background-size: 16px 16px;
      margin: 0;
      padding: 24px 16px;
      color: var(--text);
      overflow-x: hidden;
    }
    
    /* 翻頁動畫容器 */
    .book-container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      min-height: 90vh;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(70, 50, 40, 0.08), 0 0 0 1px rgba(200, 180, 160, 0.3);
      padding: 28px 20px;
      box-sizing: border-box;
      animation: pageTurn 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: left center;
    }

    @keyframes pageTurn {
      0% {
        opacity: 0;
        transform: rotateY(-18deg) translateX(30px);
      }
      100% {
        opacity: 1;
        transform: rotateY(0deg) translateX(0);
      }
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .back-btn {
      background: #faf6f0;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-dashed);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .back-btn:hover { background: #f0e6d8; }

    .pdf-btn {
      background: #fdf5e6;
      color: var(--primary);
      border: 1px solid #ebd3b0;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .header {
      text-align: center;
      padding-bottom: 14px;
      margin-bottom: 24px;
      border-bottom: 2px dashed var(--border-dashed);
    }
    .day-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      color: var(--primary);
    }

    .timeline {
      position: relative;
      padding-left: 26px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      top: 12px;
      bottom: 24px;
      left: 7px;
      width: 2px;
      border-left: 2px dashed var(--border-dashed);
    }
    .spot-block {
      position: relative;
      margin-bottom: 22px;
    }
    .spot-block::before {
      content: '';
      position: absolute;
      left: -23px;
      top: 16px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid white;
      box-shadow: 0 0 0 1.5px var(--primary);
    }
    .card {
      background: #faf6f0;
      border: 1px solid var(--border-dashed);
      border-radius: 16px;
      padding: 16px;
      position: relative;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .time { font-size: 14px; font-weight: 800; color: var(--primary); }
    .duration { font-size: 11px; font-weight: 600; background: #eae1d5; padding: 3px 8px; border-radius: 6px; color: var(--sub-text); }
    .spot-name { font-size: 16px; font-weight: 700; margin-bottom: 10px; color: var(--text); }
    
    /* 拍立得照片預覽與上傳區 */
    .polaroid-box {
      margin: 12px 0;
      background: #ffffff;
      padding: 8px 8px 24px 8px;
      border: 1px solid #e0d5c8;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }
    .polaroid-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 2px;
      background: #f5eedc;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a89a8e;
      font-size: 12px;
    }
    .polaroid-caption {
      font-size: 11px;
      color: var(--sub-text);
      margin-top: 6px;
      font-weight: 600;
    }
    .file-input { display: none; }

    .map-btn {
      font-size: 13px;
      color: #2e7d32;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
    }

    .transit-box {
      margin: 10px 0 20px 0;
      padding-left: 2px;
    }
    .transit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fffdfa;
      border: 1px dashed var(--border-dashed);
      color: #b45309;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }
    .transit-btn:hover { background: #fdf5e6; }

    /* 列印 PDF 風格 */
    .print-only { display: none; }
    @media print {
      body { background: white !important; padding: 0 !important; }
      .book-container { box-shadow: none !important; max-width: 100% !important; padding: 0 !important; animation: none !important; }
      .nav-bar, .timeline { display: none !important; }
      .print-only { display: block !important; padding: 20px; }
      .pdf-title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
      .pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
      .pdf-table th, .pdf-table td { border: 1px solid #ccc; padding: 10px; text-align: left; font-size: 14px; }
      .pdf-table th { background-color: #f2f2f2; font-weight: bold; }
      .pdf-transit-note { font-size: 12px; color: #555; background: #f9f9f9; padding: 8px 12px; border-left: 4px solid var(--primary); margin-top: 10px; }
    }
  </style>
</head>
<body>

<div class="book-container">
  <div class="nav-bar">
    <a href="view.html" class="back-btn">⬅️ 返總覽</a>
    <button onclick="window.print()" class="pdf-btn">📄 匯出 PDF</button>
  </div>

  <div class="header">
    <h1 class="day-title" id="dayPageTitle">載入中...</h1>
  </div>

  <div id="dayScheduleContent" class="timeline"></div>

  <div class="print-only">
    <h2 class="pdf-title" id="pdfHeaderTitle">簡易日程表</h2>
    <table class="pdf-table">
      <thead>
        <tr>
          <th style="width: 20%;">時間</th>
          <th style="width: 55%;">景點名稱</th>
          <th style="width: 25%;">停留時間</th>
        </tr>
      </thead>
      <tbody id="pdfTableBody"></tbody>
    </table>
    <div class="pdf-transit-note">
      💡 <strong>建議交通方式：</strong>景點間建議搭配公車、捷運等大眾運輸，或使用計程車/步行接駁。
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
