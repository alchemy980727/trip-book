<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊隨身小書</title>
  <style>
    :root {
      --primary: #c2593f;
      --bg: #f5eedc;
      --card: #fffdfa;
      --text: #2c2523;
      --sub-text: #7c6f66;
      --border-dashed: #d8c8b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#e2d5c3 1px, transparent 1px);
      background-size: 16px 16px;
      margin: 0;
      padding: 24px 16px;
      color: var(--text);
    }
    .book-container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      min-height: 90vh;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(70, 50, 40, 0.08), 0 0 0 1px rgba(200, 180, 160, 0.3);
      padding: 28px 20px;
      box-sizing: border-box;
      position: relative;
    }
    .header {
      text-align: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 2px dashed var(--border-dashed);
      position: relative;
    }
    .stamp {
      position: absolute;
      top: -10px;
      right: 0;
      border: 2px dashed var(--primary);
      color: var(--primary);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      transform: rotate(12deg);
      border-radius: 4px;
      opacity: 0.8;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 6px 0;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--sub-text);
      margin: 0;
    }
    .input-section {
      margin-bottom: 28px;
    }
    textarea {
      width: 100%;
      height: 160px;
      padding: 14px;
      border: 1.5px solid var(--border-dashed);
      border-radius: 14px;
      background: #faf6f0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
    }
    .parse-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 12px rgba(194, 89, 63, 0.25);
      transition: background 0.2s, transform 0.1s;
    }
    .parse-btn:active { transform: scale(0.98); }
    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf6f0;
      border: 1px solid var(--border-dashed);
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .saved-item:hover {
      background: #ffffff;
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .saved-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .delete-btn {
      background: transparent;
      color: #9e8e82;
      border: none;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
    }
    .delete-btn:hover { color: #d32f2f; }
  </style>
</head>
<body>

<div class="book-container">
  <div class="header">
    <div class="stamp">TRIP BOOK</div>
    <h1 class="title">📖 旅遊隨身小書</h1>
    <p class="subtitle">貼上行程文字，自動生成專屬隨身手冊</p>
  </div>

  <div class="input-section">
    <textarea id="bulkInput" placeholder="請在此貼上行程文字，例如：&#10;行程名稱：東京快閃行&#10;第一天&#10;09:00 成田機場 (停留 1小時)&#10;11:00 淺草寺 (停留 2小時)"></textarea>
    <button id="parseBtn" class="parse-btn">✨ 開啟新旅程</button>
  </div>

  <div class="section-title">📂 我的歷史行程</div>
  <div id="savedTripsList" class="saved-list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
