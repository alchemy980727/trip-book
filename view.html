<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程總覽 - 旅遊小書</title>
  <style>
    :root {
      --primary: #c2593f;
      --bg: #f5eedc;
      --card: #fffdfa;
      --text: #2c2523;
      --sub-text: #7c6f66;
      --border-dashed: #d8c8b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#e2d5c3 1px, transparent 1px);
      background-size: 16px 16px;
      margin: 0;
      padding: 24px 16px;
      color: var(--text);
    }
    .book-container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      min-height: 90vh;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(70, 50, 40, 0.08), 0 0 0 1px rgba(200, 180, 160, 0.3);
      padding: 28px 20px;
      box-sizing: border-box;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .back-btn {
      background: #faf6f0;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-dashed);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .share-btn {
      background: #fdf5e6;
      color: var(--primary);
      border: 1px solid #ebd3b0;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .header {
      text-align: center;
      padding-bottom: 18px;
      margin-bottom: 28px;
      border-bottom: 2px dashed var(--border-dashed);
    }
    .trip-title {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      color: var(--primary);
    }

    /* 流程圖與軌跡區域 */
    .flow-wrapper {
      position: relative;
      padding-left: 38px;
    }
    .flow-line {
      position: absolute;
      top: 15px;
      bottom: 25px;
      left: 15px;
      width: 4px;
      background: repeating-linear-gradient(to bottom, var(--primary) 0, var(--primary) 6px, transparent 6px, transparent 12px);
      opacity: 0.35;
      border-radius: 2px;
    }
    
    /* 小飛機移動標誌 (向左微調置於圓圈數字左側) */
    .vehicle-runner {
      position: absolute;
      left: -2px; /* 調整至圓圈左側 */
      top: 14px;
      font-size: 18px;
      z-index: 10;
      transition: top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 2px 4px rgba(194, 89, 63, 0.4));
      animation: floatVehicle 2s infinite ease-in-out;
    }

    @keyframes floatVehicle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(4deg); }
    }

    .flow-card {
      position: relative;
      background: #faf6f0;
      border: 1px solid var(--border-dashed);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      opacity: 0;
      transform: translateY(15px);
    }
    
    .flow-card.appear {
      opacity: 1;
      transform: translateY(0);
    }

    .flow-card:hover {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(194, 89, 63, 0.15);
      transform: translateY(-2px);
    }

    .flow-node-num {
      position: absolute;
      left: -38px;
      top: 14px;
      width: 30px;
      height: 30px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(194, 89, 63, 0.3);
      transition: transform 0.3s ease;
    }

    /* 波紋廣播效果 (2秒一次) */
    .flow-node-num.active-node::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--primary);
      animation: ripple2s 2s infinite ease-out;
    }

    @keyframes ripple2s {
      0% { transform: scale(1); opacity: 0.9; }
      60% { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-preview {
      font-size: 13px;
      color: var(--sub-text);
      margin-top: 8px;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      margin-top: 10px;
      background: #fdf5e6;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #ebd3b0;
    }
  </style>
</head>
<body>

<div class="book-container">
  <div class="nav-bar">
    <a href="index.html" class="back-btn">⬅️ 行程列表</a>
    <button id="shareTripBtn" class="share-btn">🔗 分享行程</button>
  </div>

  <div class="header">
    <h1 class="trip-title" id="bookTitle">載入中...</h1>
  </div>

  <div id="timelineList" class="flow-wrapper">
    <div class="flow-line"></div>
    <div id="vehicleRunner" class="vehicle-runner">✈️</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
