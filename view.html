<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程總覽 - 旅遊小書</title>
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f4f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --sub-text: #8e8e93;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 24px 16px;
      color: var(--text);
    }
    .book-container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      min-height: 90vh;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
      padding: 24px;
      box-sizing: border-box;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .back-btn {
      background: #f2f4f7;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: inline-block;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #e5e5ea; }
    
    /* 分享按鈕 */
    .share-btn {
      background: #eef6ff;
      color: var(--primary);
      border: 1px solid #cce5ff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .share-btn:hover { background: #dbeafe; }

    .header {
      text-align: center;
      padding-bottom: 18px;
      margin-bottom: 28px;
      border-bottom: 1px dashed #e5e5ea;
    }
    .trip-title {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    /* 流程圖樣式 */
    .flow-wrapper {
      position: relative;
      padding-left: 38px;
    }
    .flow-wrapper::before {
      content: '';
      position: absolute;
      top: 15px;
      bottom: 25px;
      left: 16px;
      width: 2px;
      border-left: 2px dashed #007aff;
      opacity: 0.35;
    }
    .flow-card {
      position: relative;
      background: #f8f9fa;
      border: 1px solid #eef0f2;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .flow-card:hover {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(0,122,255,0.12);
      transform: translateY(-1px);
    }
    .flow-node-num {
      position: absolute;
      left: -38px;
      top: 14px;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #007aff 0%, #0051a8 100%);
      color: white;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,122,255,0.35);
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-preview {
      font-size: 13px;
      color: var(--sub-text);
      margin-top: 8px;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      margin-top: 10px;
      background: #eef6ff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="book-container">
  <div class="nav-bar">
    <a href="index.html" class="back-btn">⬅️ 行程列表</a>
    <button id="shareTripBtn" class="share-btn">🔗 分享行程</button>
  </div>

  <div class="header">
    <h1 class="trip-title" id="bookTitle">載入中...</h1>
  </div>

  <div id="timelineList" class="flow-wrapper"></div>
</div>

<script src="app.js"></script>
</body>
</html>
